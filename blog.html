<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog PortugalApoia | Notícias, Guias e Histórias da Comunidade</title>

    <meta name="description" id="meta-description" content="Explore o nosso blog para encontrar as últimas notícias, guias úteis sobre viver em Portugal e histórias inspiradoras da nossa comunidade.">
    <meta name="keywords" id="meta-keywords" content="blog, portugal, comunidade, notícias, guias, viver em portugal, emprego, habitação">
    <meta name="author" id="meta-author" content="PortugalApoia">

    <link rel="icon" href="images_pta/logofavicon.ico" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="blog.css">
</head>

<body class="blog-page">
    <div id="preloader"><img src="images_pta/logocuadrado.jpg" alt="A carregar..." class="spinner"></div>

    <header id="header-placeholder"></header>

    <main class="blog-main-content">
        <div class="container py-5">
            <div class="blog-header">
                <h1 class="blog-title">Diário da Comunidade</h1>
                <p class="blog-subtitle">Informação, inspiração e notícias de PortugalApoia.</p>
            </div>

            <div class="search-bar-container my-5">
                <input type="text" id="blog-search-input" class="form-control" placeholder="Pesquisar artigos por título ou palavra-chave...">
            </div>

            <nav id="category-filter-nav" class="category-nav mb-5"></nav>

            <section id="all-posts">
                <div id="posts-grid">
                    </div>
                <div class="text-center mt-4" id="no-posts-message" style="display:none;">
                    <p class="lead text-muted">Não foram encontrados artigos com os seus critérios.</p>
                </div>
                 <div class="text-center mt-4">
                    <button id="load-more-posts" class="btn btn-outline-dark btn-lg" style="display: none;">Carregar Mais Artigos</button>
                </div>
            </section>
        </div>
    </main>

    <footer id="footer-placeholder" class="main-footer"></footer>

    <div class="modal fade" id="postModal" tabindex="-1" role="dialog" aria-labelledby="postModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <img src="" id="modal-image" class="modal-image" alt="Imagem do Artigo">
                    <div class="modal-post-content">
                        <h2 class="modal-title" id="postModalLabel"></h2>
                        <div id="modal-author-info" class="d-flex align-items-center my-3"></div>
                        <div class="post-meta-info" id="modal-meta"></div>
                        <hr>
                        <div class="post-body" id="modal-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
    <script src="blog.js"></script>
</body>
</html>
