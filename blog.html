<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | PortugalApoia - Notícias e Artigos</title>
    <meta name="description" content="Mantenha-se atualizado com as últimas notícias, histórias e artigos da comunidade PortugalApoia.">
    <link rel="canonical" href="https://portugalapoia.com/blog.html">
    <link rel="icon" href="images_pta/logofavicon.ico" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=23">
    <link rel="stylesheet" href="blog.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="blog-page">
    <div id="preloader"><img src="images_pta/logocuadrado.jpg" alt="A carregar..." class="spinner"></div>

    <header class="main-header">
        </header>

    <main class="blog-main-content">
        <div class="container py-5">
            <div class="blog-header text-center">
                <h1 class="blog-title">Diário da Comunidade</h1>
                <p class="blog-subtitle">Informação, inspiração e notícias de PortugalApoia.</p>
            </div>

            <section id="latest-post" class="my-5">
                </section>

            <section id="all-posts">
                <h2 class="section-title text-center mb-4">Edições Anteriores</h2>
                <div class="row" id="posts-grid">
                    </div>
                <div class="text-center mt-5" id="no-more-posts-message" style="display:none;">
                    <p class="lead text-muted">Não há mais artigos para mostrar.</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="main-footer bg-dark text-white pt-5 pb-4">
        </footer>

    <div class="modal fade" id="postModal" tabindex="-1" role="dialog" aria-labelledby="postModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <img src="" id="modal-image" class="modal-image" alt="Imagem do Artigo">
                    <div class="modal-post-content">
                        <h2 class="modal-title" id="postModalLabel"></h2>
                        <div class="post-meta-info" id="modal-meta"></div>
                        <div class="post-body" id="modal-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="blog.js"></script>
</body>
</html>
