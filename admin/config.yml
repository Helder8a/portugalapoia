backend:
  name: github
  repo: Helder8a/portugalapoia
  branch: main
  publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "conteudos"
    label: "Conteúdos das Páginas"
    files:
      - file: "_dados/homepage.json"
        label: "Página Principal"
        name: "homepage"
        fields:
          - {label: "Título Principal", name: "hero_title", widget: "string"}
          - {label: "Subtítulo", name: "hero_subtitle", widget: "string"}
          - label: "Textos dos Contadores de Impacto"
            name: "impact_counters"
            widget: "object"
            fields:
              - {label: "Texto para Doações", name: "doacoes_text", widget: "string"}
              - {label: "Texto para Emprego", name: "emprego_text", widget: "string"}
              - {label: "Texto para Total de Anúncios", name: "total_text", widget: "string"}

      - file: "_dados/sobre-nos.json"
        label: "Página Sobre Nós"
        name: "sobre_nos"
        fields:
          - label: "Secção Principal (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Título Principal", name: "title", widget: "string"}
              - {label: "Imagem de Fundo", name: "image", widget: "image"}
          - label: "Introdução"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Subtítulo", name: "subtitle", widget: "string"}
              - {label: "Texto Introdutório", name: "text", widget: "markdown"}
          - label: "Imagem Destacada (1 só imagem)"
            name: "featured_image"
            widget: "object"
            fields:
              - {label: "Imagem (formato horizontal)", name: "image", widget: "image"}
              - {label: "Legenda da Imagem", name: "caption", widget: "string", required: false}
          - label: "Missão"
            name: "mission"
            widget: "object"
            fields:
              - {label: "Ícone (Font Awesome)", name: "icon", widget: "string", hint: "Ex: fas fa-bullseye"}
              - {label: "Título da Missão", name: "title", widget: "string"}
              - {label: "Texto da Missão", name: "text", widget: "text"}
          - label: "Princípios"
            name: "principles"
            widget: "list"
            fields:
              - {label: "Ícone (Font Awesome)", name: "icon", widget: "string", hint: "Ex: fas fa-hands-helping"}
              - {label: "Título do Princípio", name: "title", widget: "string"}
              - {label: "Texto do Princípio", name: "text", widget: "text"}

      - file: "_dados/blog.json"
        label: "Publicações do Blog"
        name: "blog"
        fields:
          - name: "posts"
            label: "Artigos do Blog"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Data de Publicação", name: "date", widget: "datetime"}
              - {label: "Imagem de Destaque", name: "image", widget: "image"}
              - {label: "Categoria", name: "category", widget: "select", options: ["saude", "turismo", "educacao", "habitacao", "emprego"]}
              # --- NUEVO CAMPO: META DESCRIPTION ---
              - label: "Meta Description (para SEO)"
                name: "meta_description"
                widget: "text"
                hint: "Breve resumo (máx. 160 caracteres) que aparecerá nos resultados de pesquisa do Google."
              - {label: "Resumo", name: "summary", widget: "text"}
              # --- NUEVO CAMPO: AUTOR (CONECTADO A AUTORES.JSON) ---
              - label: "Autor"
                name: "author_id"
                widget: "relation"
                collection: "autores" # Nome da nova coleção que criaremos abaixo
                search_fields: ["nome"]
                value_field: "id"
                display_fields: ["nome"]
              - {label: "Corpo do Artigo", name: "body", widget: "markdown"}
              # --- CAMPO DE TAGS/PALAVRAS-CHAVE JÁ EXISTENTE ---
              - {label: "Tags (Palavras-chave)", name: "tags", widget: "list", hint: "Adicione palavras-chave relevantes separadas por vírgulas."}

  # --- NOVA COLEÇÃO PARA GERIR OS AUTORES ---
  - name: "autores"
    label: "Autores"
    folder: "_dados/autores"
    create: true
    slug: "{{id}}"
    fields:
      - {label: "ID Único", name: "id", widget: "string", hint: "Um identificador único, ex: 'ana_silva'"}
      - {label: "Nome do Autor", name: "nome", widget: "string"}
      - {label: "Avatar (Imagem)", name: "avatar", widget: "image", required: false}
      - {label: "Biografia", name: "bio", widget: "text"}

      - file: "_dados/empregos.json"
        label: "Vagas de Emprego"
        name: "empregos"
        fields:
          - name: "vagas"
            label: "Lista de Vagas"
            widget: "list"
            fields:
              - {label: "ID (Ex: EMP-033)", name: "id", widget: "string"}
              - {label: "Título da Vaga", name: "titulo", widget: "string"}
              - {label: "Localização", name: "localizacao", widget: "string"}
              - {label: "Descrição", name: "descricao", widget: "text"}
              - {label: "Tel", name: "contato", widget: "string", required: false}
              - {label: "Email", name: "link_contato", widget: "string", required: false}
              - {label: "Data de Publicação", name: "data_publicacao", widget: "date", required: false}
              - {label: "Data de Vencimento", name: "data_vencimento", widget: "date", required: false}

      - file: "_dados/doacoes.json"
        label: "Pedidos de Doação"
        name: "doacoes"
        fields:
          - name: "pedidos"
            label: "Lista de Pedidos"
            widget: "list"
            fields:
              - {label: "ID (Ex: DOA-004)", name: "id", widget: "string"}
              - {label: "Título do Pedido", name: "titulo", widget: "string"}
              - {label: "Localização", name: "localizacao", widget: "string"}
              - {label: "Descrição", name: "descricao", widget: "text"}
              - {label: "É Urgente?", name: "urgente", widget: "boolean", default: false}
              - {label: "Imagem (Opcional)", name: "imagem", widget: "image", required: false}
              - {label: "Tel", name: "contato", widget: "string", required: false}
              - {label: "Email", name: "link_contato", widget: "string", required: false}
              - {label: "Data de Publicação", name: "data_publicacao", widget: "date", required: false}
              - {label: "Data de Vencimento", name: "data_vencimento", widget: "date", required: false}

      - file: "_dados/servicos.json"
        label: "Ofertas de Serviço"
        name: "servicos"
        fields:
          - name: "servicos"
            label: "Lista de Serviços"
            widget: "list"
            fields:
              - {label: "ID (Ex: SER-004)", name: "id", widget: "string"}
              - {label: "Logo da Empresa (Opcional)", name: "logo_empresa", widget: "image", required: false}
              - {label: "Título do Serviço", name: "titulo", widget: "string"}
              - {label: "Valor do Serviço (Opcional)", name: "valor_servico", widget: "string", required: false}
              - {label: "Localização", name: "localizacao", widget: "string"}
              - {label: "Descrição", name: "descricao", widget: "text"}
              - {label: "Tel", name: "contato", widget: "string", required: false}
              - {label: "Email", name: "link_contato", widget: "string", required: false}
              - {label: "Data de Publicação", name: "data_publicacao", widget: "date", required: false}
              - {label: "Data de Vencimento", name: "data_vencimento", widget: "date", required: false}

      - file: "_dados/politica-privacidade.json"
        label: "Página Política de Privacidade"
        name: "politica_privacidade"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - file: "_dados/termos-de-servico.json"
        label: "Página Termos de Serviço"
        name: "termos_de_servico"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}