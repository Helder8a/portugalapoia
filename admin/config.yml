backend:
  name: git-gateway
  branch: main # O la rama principal de tu repositorio

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # --- COLECCIÓN PARA GESTIONAR LOS AUTORES (CORREGIDO) ---
  - name: "autores"
    label: "Autores"
    folder: "_dados/autores"
    create: true
    slug: "{{id}}"
    identifier_field: "id"
    fields:
      - {label: "ID Único (ej: ana_silva)", name: "id", widget: "string"}
      - {label: "Nome do Autor", name: "nome", widget: "string"}
      - {label: "Avatar (Imagem)", name: "avatar", widget: "image", required: false}
      - {label: "Biografia Curta", name: "bio", widget: "text", required: false}

  # --- COLECCIÓN PARA GESTIONAR EL BLOG (CORREGIDO) ---
  - name: "blog"
    label: "Blog"
    files:
      - file: "_dados/blog.json"
        label: "Publicações do Blog"
        name: "posts"
        fields:
          - name: "posts"
            label: "Artigos"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Data de Publicação", name: "date", widget: "datetime"}
              - {label: "Imagem de Destaque", name: "image", widget: "image"}
              - {label: "Categoria", name: "category", widget: "select", options: ["saude", "turismo", "educacao", "habitacao", "emprego"]}
              - label: "Meta Description (SEO)"
                name: "meta_description"
                widget: "text"
                hint: "Resumo para Google (máx. 160 caracteres)."
              - {label: "Resumo (aparece no card)", name: "summary", widget: "text"}
              - label: "Autor"
                name: "author_id"
                widget: "relation"
                collection: "autores" # Conecta con la colección de autores
                search_fields: ["nome"]
                value_field: "id"
                display_fields: ["nome"]
              - {label: "Corpo do Artigo", name: "body", widget: "markdown"}
              - {label: "Tags (Palavras-chave)", name: "tags", widget: "list"}

  # --- OTRAS COLECCIONES (Ejemplo para Empregos) ---
  - name: "empregos"
    label: "Vagas de Emprego"
    files:
      - file: "_dados/empregos.json"
        label: "Vagas de Emprego"
        name: "empregos_data"
        fields:
          - name: "vagas"
            label: "Lista de Vagas"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Localização", name: "localizacao", widget: "string"}
              - {label: "Descrição", name: "descricao", widget: "text"}
              - {label: "Contato", name: "contato", widget: "string", required: false}
              - {label: "Link Contato", name: "link_contato", widget: "string", required: false}
              - {label: "Data Publicação", name: "data_publicacao", widget: "date"}
              - {label: "Data Vencimento", name: "data_vencimento", widget: "date"}