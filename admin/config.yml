backend:
  name: github
  repo: Helder8a/portugalapoia
  branch: main
  publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "conteudos"
    label: "Conteúdos das Páginas"
    files:
      - - file: "_dados/sobre-nos.json"
  label: "Página Sobre Nós"
  name: "sobre_nos"
  fields:
    - {label: "Título da Página (separador)", name: "title", widget: "string"}
    - label: "Secção Principal (Hero)"
      name: "hero"
      widget: "object"
      fields:
        - {label: "Título Principal", name: "title", widget: "string"}
        - {label: "Imagem de Fundo", name: "image", widget: "image"}
    - label: "Introdução"
      name: "intro"
      widget: "object"
      fields:
        - {label: "Subtítulo", name: "subtitle", widget: "string"}
        - {label: "Texto Introdutório", name: "text", widget: "markdown"}
    - label: "Missão"
      name: "mission"
      widget: "object"
      fields:
        - {label: "Ícone (Font Awesome)", name: "icon", widget: "string", hint: "Ex: fas fa-bullseye"}
        - {label: "Título da Missão", name: "title", widget: "string"}
        - {label: "Texto da Missão", name: "text", widget: "text"}
    - label: "Princípios"
      name: "principles"
      widget: "list"
      fields:
        - {label: "Ícone (Font Awesome)", name: "icon", widget: "string", hint: "Ex: fas fa-hands-helping"}
        - {label: "Título do Princípio", name: "title", widget: "string"}
        - {label: "Texto do Princípio", name: "text", widget: "text"}
        
      # --- PÁGINAS ESTÁTICAS GERENCIÁVEIS ---
      - file: "_dados/sobre-nos.json"
        label: "Página Sobre Nós"
        name: "sobre_nos"
        fields:
          - {label: "Título Principal da Página", name: "title", widget: "string"}
          - {label: "Imagem de Destaque", name: "image", widget: "image"}
          - {label: "Conteúdo Principal", name: "body", widget: "markdown"}

      - file: "_dados/politica-privacidade.json"
        label: "Página Política de Privacidade"
        name: "politica_privacidade"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - file: "_dados/termos-de-servico.json"
        label: "Página Termos de Serviço"
        name: "termos_de_servico"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}
      # --- FIM DAS PÁGINAS ESTÁTICAS ---

      - file: "_dados/homepage.json"
        label: "Conteúdo da Página Principal"
        name: "homepage"
        fields:
          - {label: "Título Principal", name: "hero_title", widget: "string"}
          - {label: "Subtítulo", name: "hero_subtitle", widget: "string"}
          - {label: "Textos dos Contadores de Impacto", name: "impact_counters", widget: "object", fields: [{label: "Texto para Doações", name: "doacoes_text", widget: "string"}, {label: "Texto para Emprego", name: "emprego_text", widget: "string"}, {label: "Texto para Total de Anúncios", name: "total_text", widget: "string"}]}