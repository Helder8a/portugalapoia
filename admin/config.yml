backend:
  name: github
  repo: Helder8a/portugalapoia
  branch: main
  publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "conteudos"
    label: "Conteúdos das Páginas"
    files:
      # --- PÁGINAS PRINCIPALES ---
      - file: "_dados/homepage.json"
        label: "Página Principal (Homepage)"
        name: "homepage"
        fields:
          - {label: "Título Principal", name: "hero_title", widget: "string"}
          - {label: "Subtítulo", name: "hero_subtitle", widget: "string"}

      - file: "_dados/sobre-nos.json"
        label: "Página Sobre Nós"
        name: "sobre_nos"
        fields:
          - label: "Secção Principal (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Título Principal", name: "title", widget: "string"}
              - {label: "Imagem de Fundo", name: "image", widget: "image"}
          - label: "Introdução"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Subtítulo", name: "subtitle", widget: "string"}
              - {label: "Texto Introdutório", name: "text", widget: "markdown"}
          - label: "Imagens Destacadas (Máx. 2)"
            name: "featured_images"
            widget: "list"
            min: 1
            max: 2
            summary: "{{fields.caption}}"
            fields:
              - {label: "Imagem (formato horizontal)", name: "image", widget: "image"}
              - {label: "Legenda da Imagem", name: "caption", widget: "string", required: false}
          - label: "Missão"
            name: "mission"
            widget: "object"
            fields:
              - {label: "Ícone (Font Awesome)", name: "icon", widget: "string", hint: "Ex: fas fa-bullseye"}
              - {label: "Título da Missão", name: "title", widget: "string"}
              - {label: "Texto da Missão", name: "text", widget: "text"}
          - label: "Princípios"
            name: "principles"
            widget: "list"
            fields:
              - {label: "Ícone (Font Awesome)", name: "icon", widget: "string", hint: "Ex: fas fa-hands-helping"}
              - {label: "Título do Princípio", name: "title", widget: "string"}
              - {label: "Texto do Princípio", name: "text", widget: "text"}

      # --- COLECCIONES DE PUBLICACIONES (RECUPERADAS) ---
      - file: "_dados/blog.json"
        label: "Publicações do Blog"
        name: "blog"
        fields:
          - name: "posts"
            label: "Artigos do Blog"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Data de Publicação", name: "date", widget: "datetime"}
              - {label: "Imagem de Destaque", name: "image", widget: "image"}
              - {label: "Categoria", name: "category", widget: "select", options: ["saude", "turismo", "educacao", "habitacao", "emprego"]}
              - {label: "Resumo", name: "summary", widget: "text"}
              - {label: "Corpo do Artigo", name: "body", widget: "markdown"}

      - file: "_dados/empregos.json"
        label: "Vagas de Emprego"
        name: "empregos"
        fields:
          - label: "Lista de Vagas"
            name: "vagas"
            widget: "list"
            fields:
              - {label: "Título da Vaga", name: "titulo", widget: "string"}
              - {label: "Localização", name: "localizacao", widget: "string"}
              - {label: "Descrição", name: "descricao", widget: "text"}
              - {label: "Contacto (Tel)", name: "contato", widget: "string", required: false}
              - {label: "Contacto (Email)", name: "link_contato", widget: "string", required: false}

      - file: "_dados/doacoes.json"
        label: "Pedidos de Doação"
        name: "doacoes"
        fields:
          - label: "Lista de Pedidos"
            name: "pedidos"
            widget: "list"
            fields:
              - {label: "Título do Pedido