<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós | A Missão da PortugalApoia</title>
    <meta name="description" content="Conheça a história, missão e valores da PortugalApoia. Uma comunidade dedicada a conectar a generosidade à necessidade em Portugal.">
    <link rel="canonical" href="https://portugalapoia.com/sobre-nos.html">
    <link rel="icon" href="images_pta/logofavicon.ico" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css?v=10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="preloader"><img src="images_pta/logocuadrado.jpg" alt="A carregar..." class="spinner"></div>

    <header class="main-header"></header>

    <main>
        <section id="page-hero" class="hero-sobre text-center d-flex align-items-center">
            <div class="container">
                <h1 id="page-title" class="page-title"></h1>
            </div>
        </section>

        <section class="mission-block py-5">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-7">
                        <div id="page-content"></div>
                    </div>
                    <div class="col-lg-5 text-center">
                        <img id="page-image" src="" alt="Imagem Sobre Nós" class="img-fluid rounded shadow-lg">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('/_dados/sobre-nos.json');
            const data = await response.json();

            document.getElementById('page-title').textContent = data.title;
            
            const pageImage = document.getElementById('page-image');
            pageImage.src = data.image;
            pageImage.alt = data.title;

            // Renderiza o conteúdo Markdown para HTML
            document.getElementById('page-content').innerHTML = marked.parse(data.body);

        } catch (error) {
            console.error("Erro ao carregar o conteúdo da página:", error);
            document.getElementById('page-content').innerHTML = "<p>Não foi possível carregar o conteúdo. Tente novamente mais tarde.</p>";
        }
    });
    </script>
</body>
</html>
