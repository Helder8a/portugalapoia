<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós | A Missão da PortugalApoia</title>
    <meta name="description" content="Conheça a história, missão e valores da PortugalApoia. Uma comunidade dedicada a conectar a generosidade à necessidade em Portugal.">
    <link rel="canonical" href="https://portugalapoia.com/sobre-nos.html">
    <link rel="icon" href="images_pta/logofavicon.ico" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css?v=18">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="preloader"><img src="images_pta/logocuadrado.jpg" alt="A carregar..." class="spinner"></div>

    <header class="main-header">
        </header>

    <main>
        <section id="hero-sobre" class="text-center text-white d-flex align-items-center justify-content-center"></section>

        <div class="container py-5">
            <section id="intro-sobre" class="text-center mb-5"></section>

            <section id="single-image-section" class="mb-5"></section>

            <section id="mission-sobre" class="text-center bg-light p-5 rounded mb-5"></section>

            <section id="principles-sobre">
                <h2 class="section-title text-center mb-4">Os Nossos Princípios</h2>
                <div class="row"></div>
            </section>
        </div>
    </main>

    <footer class="main-footer bg-dark text-white pt-5 pb-4">
        </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('/_dados/sobre-nos.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('Falha ao carregar dados');
            const data = await response.json();

            // Cargar Hero, Misión y Principios (sin cambios)
            if (data.hero) {
                const heroSection = document.getElementById('hero-sobre');
                heroSection.style.backgroundImage = `linear-gradient(rgba(10, 61, 98, .8), rgba(10, 61, 98, .6)), url('${data.hero.image}')`;
                heroSection.innerHTML = `<div class="container"><h1 class="page-title">${data.hero.title}</h1></div>`;
            }
            if (data.intro) {
                const introSection = document.getElementById('intro-sobre');
                introSection.innerHTML = `<div class="col-lg-10 mx-auto"><h3>${data.intro.subtitle}</h3><p class="lead">${data.intro.text.replace(/\n/g, '<br>')}</p></div>`;
            }
            if (data.mission) {
                const missionSection = document.getElementById('mission-sobre');
                missionSection.innerHTML = `<i class="${data.mission.icon} pillar-icon mb-3"></i><h3>${data.mission.title}</h3><p class="lead">${data.mission.text}</p>`;
            }
            if (data.principles && data.principles.length > 0) {
                const principlesRow = document.querySelector('#principles-sobre .row');
                principlesRow.innerHTML = data.principles.map(p => `<div class="col-md-4 mb-4"><div class="card h-100 text-center pillar-card"><div class="card-body"><i class="${p.icon} pillar-icon mb-3"></i><h4>${p.title}</h4><p>${p.text}</p></div></div></div>`).join('');
            }
            
            // Cargar la NUEVA Imagen Destacada
            if (data.featured_image && data.featured_image.image) {
                const imageSection = document.getElementById('single-image-section');
                imageSection.innerHTML = `
                    <div class="single-image-wrapper">
                        <figure class="single-featured-image">
                            <img src="${data.featured_image.image}" alt="${data.featured_image.caption || 'Imagem de destaque'}">
                            ${data.featured_image.caption ? `<figcaption>${data.featured_image.caption}</figcaption>` : ''}
                        </figure>
                    </div>
                `;
            }

        } catch (error) {
            console.error("Erro ao carregar o conteúdo da página Sobre Nós:", error);
        }
    });
    </script>
</body>
</html>
