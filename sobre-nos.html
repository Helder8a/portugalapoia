<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós | A Missão da PortugalApoia</title>
    <meta name="description" content="Conheça a história, missão e valores da PortugalApoia. Uma comunidade dedicada a conectar a generosidade à necessidade em Portugal.">
    <link rel="canonical" href="https://portugalapoia.com/sobre-nos.html">
    <link rel="icon" href="images_pta/logofavicon.ico" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css?v=12">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <main>
        <section id="hero-sobre" class="text-center text-white"></section>

        <div class="container py-5">
            <section id="intro-sobre" class="text-center mb-5"></section>

            <section id="mission-sobre" class="text-center bg-light p-5 rounded mb-5"></section>
            
            <section id="principles-sobre">
                <h2 class="section-title text-center">Os Princípios que Nos Guiam</h2>
                <div class="row"></div>
            </section>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
    
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('/_dados/sobre-nos.json');
            const data = await response.json();

            // Cargar Hero
            const heroSection = document.getElementById('hero-sobre');
            heroSection.style.backgroundImage = `linear-gradient(rgba(10, 61, 98, .8), rgba(10, 61, 98, .6)), url('${data.hero.image}')`;
            heroSection.classList.add('hero-sobre');
            heroSection.innerHTML = `<div class="container"><h1 class="page-title">${data.hero.title}</h1></div>`;
            
            // Cargar Introducción
            document.getElementById('intro-sobre').innerHTML = `
                <h3>${data.intro.subtitle}</h3>
                <p class="lead">${data.intro.text.replace(/\n/g, '<br>')}</p>
            `;

            // Cargar Misión
            document.getElementById('mission-sobre').innerHTML = `
                <i class="${data.mission.icon} pillar-icon"></i>
                <h3>${data.mission.title}</h3>
                <p class="lead">${data.mission.text}</p>
            `;

            // Cargar Principios
            const principlesRow = document.querySelector('#principles-sobre .row');
            principlesRow.innerHTML = data.principles.map(p => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 text-center pillar-card">
                        <div class="card-body">
                            <i class="${p.icon} pillar-icon"></i>
                            <h4>${p.title}</h4>
                            <p>${p.text}</p>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (error) {
            console.error("Erro ao carregar o conteúdo da página Sobre Nós:", error);
        }
    });
    </script>
</body>
</html>
