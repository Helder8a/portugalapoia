<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Política de Privacidade | PortugalApoia</title>
    <meta name="description" content="Consulte a nossa política de privacidade para saber como tratamos os seus dados.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://portugalapoia.com/politica-privacidade.html">
    <link rel="icon" href="images_pta/logofavicon.ico" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css?v=9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="preloader"><img src="images_pta/logocuadrado.jpg" alt="A carregar..." class="spinner"></div>

    <header class="main-header"></header>

    <main>
        <section class="page-header text-center text-white">
            <div class="container">
                <h1 id="page-title" class="page-title"></h1>
            </div>
        </section>

        <section class="py-5">
            <div class="container">
                <div class="row">
                    <div id="page-content" class="col-md-10 mx-auto">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('/_dados/politica-privacidade.json');
            const data = await response.json();

            document.getElementById('page-title').textContent = data.title;
            document.getElementById('page-content').innerHTML = marked.parse(data.body);

        } catch (error) {
            console.error("Erro ao carregar o conteúdo da página:", error);
            document.getElementById('page-content').innerHTML = "<p>Não foi possível carregar o conteúdo. Tente novamente mais tarde.</p>";
        }
    });
    </script>
</body>
</html>
